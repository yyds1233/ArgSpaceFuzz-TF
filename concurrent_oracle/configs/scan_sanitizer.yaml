framework: tensorflow

paths:
  corpus_dir: /root/corpus_experiment_save

environment:
  device: CPU
  cuda_visible_devices: "-1"
  require_cpu_only: true
  multiprocessing_start_method: spawn

runtime:
  external_threads: [1, 2, 4]
  intra_op_threads: [1, 4]
  inter_op_threads: [1, 2]
  tf_data_parallel_calls: [1]
  deterministic: [true]

generation:
  max_repair_attempts: 1
  use_template_first: true
  use_llm_transform: false

execution:
  trials: 3
  timeout_seconds: 60
  no_progress_timeout_seconds: 20
  max_parallel_processes: 1
  cases_per_api: 12
  process_repetitions: 1

# O9 is attached to the CPU scenarios that can run under the instrumented
# build.  O1 is included because invalid-input rejection is a natural
# companion for native safety.
oracle_enabled: [O1, O2, O3, O8, O9]

comparison:
  float_atol: 1.0e-6
  float_rtol: 1.0e-5
  exact_integer: true
  compare_nan_mask: true
  compare_inf_sign: true

sanitizer:
  enabled: true
  type: asan
  build_id: tf_fuzz-selfbuilt-2.21
  instrumented: true
  # This runtime must match the instrumented TensorFlow build.  Override it
  # with the TSan runtime for a TSan build, and never mix builds.
  preload_path: /root/tf_fuzz/lib/python3.10/site-packages/asan_with_fuzzer.so
  options: "detect_leaks=0"
